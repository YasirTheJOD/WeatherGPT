# WeatherGPT web front end (Phase 7 deployment).
#
# Mounted into the `web` service at /etc/nginx/conf.d/default.conf. Serves the
# built Flutter web PWA and reverse-proxies /api to the backend on the SAME
# origin, so the browser needs no CORS and the API host never leaks into the
# client bundle (build with --dart-define=API_BASE_URL=http://<this-host>:8080).
#
# The `/chat` endpoint is Server-Sent Events: buffering must be off or the
# token stream stalls until the response completes.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Image healthcheck target — independent of whether the Flutter build is
    # present, so a missing `build/web` doesn't mark the container unhealthy.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # API + SSE -> FastAPI. `^~` keeps this above the asset regex below.
    location ^~ /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE: never buffer, never time out mid-answer.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Hashed Flutter assets are immutable; cache them aggressively.
    location ~* \.(?:js|wasm|css|png|jpe?g|gif|svg|ico|woff2?|ttf|otf)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # Single-page app: unknown paths fall back to the shell.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
